<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="index.css" />
  </head>

    <h1>Blackjack</h1>
    <p id="message-el">Want to play a round?</p>

    <p id="lifes"></p>
    <script src="index.js"></script>
  </body>
</html>
